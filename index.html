		<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/clippy.js/1.0.0/clippy.min.css" />
		<style>
			#startOverlay {
				position: fixed;
				inset: 0;
				background: radial-gradient(circle at center, #111, #000);
				z-index: 9999;
				display: flex;
				align-items: center;
				justify-content: center;
			}

			.start-box {
				text-align: center;
				color: white;
				font-family: system-ui, sans-serif;
				animation: pulse 1.5s infinite;
			}

			.start-box .icon {
				font-size: 64px;
				margin-bottom: 16px;
			}

			.start-box .text {
				font-size: 28px;
				font-weight: 600;
			}

			@keyframes pulse {
				0% { transform: scale(1); opacity: 1; }
				50% { transform: scale(1.05); opacity: 0.85; }
				100% { transform: scale(1); opacity: 1; }
			}
			/* Nền pháo hoa */
			.stage-container {
				position: relative;
				z-index: 1;
			}

			/* Canvas chữ particle đè lên trên */
			.canvas-text {
				position: fixed;
				inset: 0;
				z-index: 20;            /* cao hơn pháo hoa */
				pointer-events: none;  /* không chặn click */
			}

			#rotateNotice {
				position: fixed;
				inset: 0;
				background: #000;
				color: white;
				display: none;
				align-items: center;
				justify-content: center;
				text-align: center;
				font-size: 22px;
				z-index: 10;
			}
			/* Khu vực demo ảnh dùng clip-path (tròn + trái tim) */
			.shape-gallery {
				display: flex;
				gap: 24px;
				justify-content: center;
				align-items: center;
				padding: 16px;
			}
			.shape-card {
				width: 240px;
				height: 240px;
				position: relative;
			}
			.shape-card img {
				width: 100%;
				height: 100%;
				object-fit: cover;
				display: block;
			}
			/* Ảnh tròn */
			.shape-circle img {
				border-radius: 50%;
			}
			/* Ảnh trái tim */
			.shape-heart img {
				clip-path: path("M 120 224 C 8 144 0 72 60 40 C 96 24 120 40 120 56 C 120 40 144 24 180 40 C 240 72 232 144 120 224 Z");
				-webkit-clip-path: path("M 120 224 C 8 144 0 72 60 40 C 96 24 120 40 120 56 C 120 40 144 24 180 40 C 240 72 232 144 120 224 Z");
			}
			/* Fallback mask cho trình duyệt cũ */
			@supports not (clip-path: path("M 120 224 C 8 144 0 72 60 40 C 96 24 120 40 120 56 C 120 40 144 24 180 40 C 240 72 232 144 120 224 Z")) {
				.shape-heart img {
					mask-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240"><path d="M120 224 C8 144 0 72 60 40 C96 24 120 40 120 56 C120 40 144 24 180 40 C240 72 232 144 120 224 Z" fill="white"/></svg>');
					-webkit-mask-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240"><path d="M120 224 C8 144 0 72 60 40 C96 24 120 40 120 56 C120 40 144 24 180 40 C240 72 232 144 120 224 Z" fill="white"/></svg>');
					mask-size: contain;
					-webkit-mask-size: contain;
					mask-repeat: no-repeat;
					-webkit-mask-repeat: no-repeat;
				}
			}

			/* Layer chứa lời chúc bay trên nền pháo hoa */
			.wishes-layer {
				position: absolute;
				inset: 0;
				z-index: 10; /* Hiển thị trên canvas */
				pointer-events: none; /* không chặn click vào canvas / nút điều khiển */
				transform-origin: center center;
				transform-style: preserve-3d; /* Cho phép 3D transform */
				will-change: transform; /* Tối ưu performance */
			}

			/* Tắt transition khi đang drag để giảm lag */
			.wishes-layer.dragging {
				transition: none;
			}

			/* Wrapper anim bay lên (dùng transform riêng) */
			.wish-wrapper {
				position: absolute;
				bottom: -3rem;
				left: 50%;
				transform: translateX(-50%) translateY(0);
				opacity: 0;
				pointer-events: none; /* bản thân wrapper không nhận sự kiện */
			}

			/* Câu chúc màu hồng phát sáng, có thể xoay / thu phóng bằng tay */
			.wish-text {
				display: inline-block;
				font-size: 1.1rem;
				padding: 0.4rem 1rem;
				border-radius: 999px;
				color: #ff9ad9;
				text-shadow:
					0 0 6px rgba(255, 105, 180, 0.9),
					0 0 18px rgba(255, 20, 147, 0.8);
				background: rgba(0, 0, 0, 0.3);
				border: 1px solid rgba(255, 192, 203, 0.7);
				box-shadow:
					0 0 14px rgba(255, 105, 180, 0.7),
					0 0 32px rgba(255, 20, 147, 0.4);
				white-space: nowrap;
				transform-origin: center center;
				pointer-events: auto; /* cho phép chạm/drag để xoay, scale */
			}

			/* Responsive cho mobile */
			@media (max-width: 768px) {
				.wish-text {
					font-size: 0.9rem; /* Tăng font-size một chút để đọc tốt hơn */
					padding: 0.35rem 1rem; /* Tăng padding để có không gian hơn */
					max-width: 92vw; /* Tăng max-width để hiển thị nhiều chữ hơn */
					min-width: 200px; /* Đảm bảo chiều rộng tối thiểu */
					white-space: normal; /* Cho phép xuống dòng trên mobile */
					word-wrap: break-word;
					word-break: break-word; /* Ngắt từ tốt hơn */
					display: -webkit-box;
					-webkit-line-clamp: 2; /* Giới hạn tối đa 2 dòng */
					line-clamp: 2; /* Thuộc tính chuẩn */
					-webkit-box-orient: vertical;
					overflow: hidden;
					text-overflow: ellipsis;
					line-height: 1.5; /* Tăng line-height để đọc tốt hơn */
				}
			}

			@media (max-width: 480px) {
				.wish-text {
					font-size: 0.8rem;
					padding: 0.3rem 0.85rem;
					max-width: 94vw; /* Tăng max-width trên mobile nhỏ */
					min-width: 180px; /* Chiều rộng tối thiểu */
					-webkit-line-clamp: 2; /* Vẫn giới hạn 2 dòng trên mobile nhỏ */
					line-clamp: 2; /* Thuộc tính chuẩn */
					line-height: 1.4;
				}
			}

			/* Bay chậm đều từ dưới lên trên */
			@keyframes wishFloatUp {
				0% {
					opacity: 0;
					transform: translateX(-50%) translateY(10vh);
				}
				15% {
					opacity: 1;
				}
				100% {
					opacity: 0;
					transform: translateX(-50%) translateY(-110vh);
				}
			}

			.wish-animate {
				animation: wishFloatUp 7s linear forwards;
			}

			/* Ảnh bay lên cùng câu chúc */
			.wish-image {
				display: inline-block;
				width: 120px;
				height: 120px;
				object-fit: cover;
				border-radius: 12px;
				border: 3px solid rgba(255, 192, 203, 0.9);
				box-shadow:
					0 0 20px rgba(255, 105, 180, 0.8),
					0 0 40px rgba(255, 20, 147, 0.6),
					0 0 60px rgba(255, 20, 147, 0.4),
					inset 0 0 20px rgba(255, 192, 203, 0.3);
				transform-origin: center center;
				pointer-events: auto;
				animation: imageGlow 2s ease-in-out infinite alternate;
			}

			/* Responsive ảnh bay lên cho mobile */
			@media (max-width: 768px) {
				.wish-image {
					width: 80px;
					height: 80px;
					border-width: 2px;
					border-radius: 8px;
				}
			}

			@media (max-width: 480px) {
				.wish-image {
					width: 60px;
					height: 60px;
					border-width: 2px;
					border-radius: 6px;
				}
			}

			/* Hiệu ứng phát sáng cho ảnh */
			@keyframes imageGlow {
				0% {
					box-shadow:
						0 0 20px rgba(255, 105, 180, 0.8),
						0 0 40px rgba(255, 20, 147, 0.6),
						0 0 60px rgba(255, 20, 147, 0.4),
						inset 0 0 20px rgba(255, 192, 203, 0.3);
					border-color: rgba(255, 192, 203, 0.9);
				}
				100% {
					box-shadow:
						0 0 30px rgba(255, 105, 180, 1),
						0 0 60px rgba(255, 20, 147, 0.9),
						0 0 90px rgba(255, 20, 147, 0.7),
						inset 0 0 30px rgba(255, 192, 203, 0.5);
					border-color: rgba(255, 255, 255, 1);
				}
			}

			/* Wrapper cho ảnh */
			.wish-image-wrapper {
				position: absolute;
				bottom: -3rem;
				left: 50%;
				transform: translateX(-50%) translateY(0);
				opacity: 0;
				pointer-events: none;
			}

			/* Ẩn nút pause và nút cài đặt */
			.pause-btn,
			.settings-btn {
				display: none !important;
			}

		</style>

		<script>
			let hasStarted = false;
			let isLandscapeAllowed = false;
			const canvas = document.getElementById("canvas-text");
			const ctx = canvas.getContext("2d");
			const notice = document.getElementById("rotateNotice");

			function resize() {
				canvas.width = window.innerWidth;
				canvas.height = window.innerHeight;
				checkOrientation();
			}

			window.addEventListener("resize", resize);
			resize();

			function checkOrientation() {
				const isMobile = /iPhone|Android/i.test(navigator.userAgent);
				const isLandscape = window.innerWidth > window.innerHeight;

				if (isMobile && !isLandscape) {
					// 📱 Mobile xoay dọc
					isLandscapeAllowed = false;
					notice.style.display = "flex";
					canvas.style.display = "none";
					document.getElementById("startOverlay").style.display = "none";
				} else {
					// ✅ Xoay ngang hoặc PC
					isLandscapeAllowed = true;
					notice.style.display = "none";
					canvas.style.display = "block";

					if (!hasStarted) {
						document.getElementById("startOverlay").style.display = "flex";
					}
				}
			}

			document.addEventListener("click", () => {
				if (!isLandscapeAllowed || hasStarted) return;

				hasStarted = true;

				// 🎵 Play nhạc
				const music = document.getElementById("bgMusic");
				music.volume = 0.7;
				music.play().catch(() => {});

				// Ẩn overlay
				document.getElementById("startOverlay").style.display = "none";

				// ▶️ Bắt đầu animation
				nextText();
				animate();
			}, { once: true });

			const texts = [
				"3",
				"2",
				"1",
				"Chúc em một năm mới thật nhiều niềm vui",
				"Mong em luôn mạnh khỏe và bình an",
				"Vui vẻ và hành phúc",
				"Gặp nhiều may mắn trong cuộc sống",
				"Cảm ơn em vì đã đến",
				"Happy new year 🎉",
			];

			let textIndex = 0;
			let particles = [];

			class Particle {
				constructor(x, y) {
					this.x = Math.random() * canvas.width;
					this.y = Math.random() * canvas.height;
					this.destX = x;
					this.destY = y;
					this.size = 2.8;
					this.color = "#ffffff";
				}

				update() {
					this.x += (this.destX - this.x) * 0.1;
					this.y += (this.destY - this.y) * 0.1;
				}

				draw() {
					ctx.fillStyle = this.color;
					ctx.beginPath();
					ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
					ctx.fill();
				}
			}

			// ✨ TỰ ĐỘNG XUỐNG DÒNG + CĂN GIỮA
			function wrapText(text, maxWidth) {
				const words = text.split(" ");
				let lines = [];
				let line = "";

				for (let i = 0; i < words.length; i++) {
					const testLine = line + words[i] + " ";
					const metrics = ctx.measureText(testLine);
					if (metrics.width > maxWidth && i > 0) {
						lines.push(line);
						line = words[i] + " ";
					} else {
						line = testLine;
					}
				}
				lines.push(line);
				return lines;
			}

			function createTextParticles(text) {
				particles = [];
				ctx.clearRect(0, 0, canvas.width, canvas.height);

				const fontSize = canvas.width < 700 ? 45 : 90;
				ctx.font = `900 ${fontSize}px Arial`;
				ctx.fillStyle = "#fff";
				ctx.textAlign = "center";
				ctx.textBaseline = "middle";

				const maxTextWidth = canvas.width * 0.9;
				const lines = wrapText(text, maxTextWidth);
				const lineHeight = fontSize * 1.2;
				const startY = canvas.height / 2 - (lines.length - 1) * lineHeight / 2;

				lines.forEach((line, i) => {
					ctx.fillText(line, canvas.width / 2, startY + i * lineHeight);
				});

				const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
				ctx.clearRect(0, 0, canvas.width, canvas.height);

				for (let y = 0; y < canvas.height; y += 6) {
					for (let x = 0; x < canvas.width; x += 6) {
						const index = (y * canvas.width + x) * 4;
						if (imageData.data[index + 3] > 150) {
							particles.push(new Particle(x, y));
						}
					}
				}
			}

			function animate() {
				ctx.clearRect(0, 0, canvas.width, canvas.height);
				particles.forEach(p => {
					p.update();
					p.draw();
				});
				requestAnimationFrame(animate);
			}

			function nextText() {
				createTextParticles(texts[textIndex]);
				textIndex++;
				if (textIndex < texts.length) {
					setTimeout(nextText, 3500);
				}
			}

			checkOrientation();
		</script>
